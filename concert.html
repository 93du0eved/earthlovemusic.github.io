<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>지구사랑음악</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            padding: 60px 24px;
            overflow-x: hidden;

            background-color: #fff;
            color: #111;
            font-family: Arial, sans-serif;
        }

        /* 공연 정보 전체 영역 */
        .concert-info {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;

            opacity: 0;
            transform: translateY(25px);

            animation: pageAppear 1.1s ease 0.35s forwards;
        }

        @keyframes pageAppear {
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        /* 제목 */
        .page-header {
            margin-bottom: 60px;
            text-align: center;
        }

        .sub-title {
            margin: 0 0 12px;

            color: #111;
            font-size: 14px;
            font-weight: 700;
            letter-spacing: 5px;
        }

        h1 {
            margin: 0;

            color: #111;
            font-size: clamp(36px, 8vw, 64px);
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 1.1;
        }

        /* 공연 정보 목록 */
        .info-list {
            border-top: 1px solid #111;
        }

        .info-item {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 25px;
            align-items: center;

            min-height: 100px;
            padding: 25px 5px;

            border-bottom: 1px solid #111;
        }

        .label {
            color: #111;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 2px;
        }

        .value {
            margin: 0;

            color: #111;
            font-size: clamp(17px, 4vw, 21px);
            font-weight: 500;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* 출연진 */
        .cast-item {
            align-items: start;
        }

        .cast-item .label {
            padding-top: 4px;
        }

        .cast-list {
            display: flex;
            flex-direction: column;
            gap: 25px;
        }

        .cast-team strong {
            display: block;
            margin-bottom: 8px;

            color: #111;
            font-size: 17px;
            font-weight: 800;
        }

        .cast-team p {
            margin: 0;

            color: #111;
            font-size: 18px;
            font-weight: 500;
            line-height: 1.7;
            word-break: keep-all;
        }

        /* 하단 LP판 */
        .vinyl-section {
            padding: 75px 20px 20px;
            overflow: hidden;
            text-align: center;
        }

        .vinyl-text {
            margin: 0 0 25px;

            color: #111;
            font-size: 12px;
            font-weight: 700;
            letter-spacing: 4px;
        }

        .vinyl {
            position: relative;

            width: min(65vw, 280px);
            aspect-ratio: 1;
            margin: 0 auto;

            border-radius: 50%;

            background:
                repeating-radial-gradient(
                    circle,
                    #111 0,
                    #111 4px,
                    #242424 5px,
                    #242424 7px
                );

            box-shadow: 0 12px 30px rgba(0, 0, 0, 0.2);

            animation: vinylSpin 6s linear infinite;
        }

        .vinyl::before {
            content: "";

            position: absolute;
            inset: 31%;

            border: 4px solid #f5f1c9;
            border-radius: 50%;
            background-color: #bde4f8;
        }

        .vinyl::after {
            content: "";

            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 3;

            width: 13px;
            height: 13px;

            border-radius: 50%;
            background-color: #fff;

            transform: translate(-50%, -50%);
        }

        .vinyl-label {
            position: absolute;
            top: 50%;
            left: 50%;
            z-index: 2;

            width: 27%;

            color: #17277b;
            font-size: clamp(8px, 2.4vw, 12px);
            font-weight: 900;
            line-height: 1.2;
            text-align: center;

            transform: translate(-50%, -50%);
        }

        @keyframes vinylSpin {
            to {
                transform: rotate(360deg);
            }
        }

        /* 터치 이모지 */
        .touch-emoji {
            position: fixed;
            z-index: 1500;

            font-size: 27px;
            line-height: 1;

            pointer-events: none;
            user-select: none;

            animation: touchPop 0.85s ease-out forwards;
        }

        @keyframes touchPop {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.4);
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        calc(-50% + var(--move-x)),
                        calc(-50% - 70px)
                    )
                    scale(1.3)
                    rotate(var(--rotate));
            }
        }

        /* 처음 들어올 때 이모지 비 */
        #emojiRain {
            position: fixed;
            inset: 0;
            z-index: 1000;

            overflow: hidden;
            pointer-events: none;
        }

        .rain-emoji {
            position: absolute;
            top: -80px;
            line-height: 1;

            animation: emojiFall var(--fall-time) linear forwards;
            animation-delay: var(--fall-delay);
        }

        @keyframes emojiFall {
            from {
                opacity: 1;
                transform: translateY(-10vh) rotate(0deg);
            }

            to {
                opacity: 0.8;
                transform:
                    translateY(120vh)
                    rotate(var(--fall-rotate));
            }
        }

        /* 모바일 */
        @media (max-width: 600px) {
            body {
                padding: 45px 22px;
            }

            .page-header {
                margin-bottom: 45px;
            }

            .sub-title {
                font-size: 12px;
                letter-spacing: 4px;
            }

            h1 {
                letter-spacing: -2.5px;
            }

            .info-item {
                grid-template-columns: 90px minmax(0, 1fr);
                gap: 12px;
                min-height: 90px;
                padding: 22px 0;
            }

            .label {
                font-size: 12px;
                letter-spacing: 1px;
            }

            .cast-team strong,
            .cast-team p {
                font-size: 16px;
            }

            .vinyl-section {
                padding-top: 60px;
            }
        }
    </style>
</head>

<body>

    <div id="emojiRain"></div>

    <main class="concert-info">

        <header class="page-header">
            <p class="sub-title">LIVE BUSKING</p>
            <h1>지구사랑음악</h1>
        </header>

        <section class="info-list">

            <div class="info-item">
                <span class="label">DATE</span>
                <p class="value">2026.09.10</p>
            </div>

            <div class="info-item">
                <span class="label">LOCATION</span>
                <p class="value">대운동장</p>
            </div>

            <div class="info-item">
                <span class="label">TIME</span>
                <p class="value">15:00</p>
            </div>

            <div class="info-item cast-item">
                <span class="label">CAST</span>

                <div class="cast-list">

                    <div class="cast-team">
                        <strong>TEAM 파랗게</strong>
                        <p>이건우 · 이영인 · 이창민 · 문수현</p>
                    </div>

                    <div class="cast-team">
                        <strong>TEAM 디마레인저</strong>
                        <p>송준성 · 이영인 · 엄가은</p>
                    </div>

                </div>
            </div>

        </section>

        <!-- 회전하는 LP판 -->
        <section class="vinyl-section">
            <p class="vinyl-text">EARTH LOVE MUSIC</p>

            <div class="vinyl">
                <span class="vinyl-label">
                    지구<br>사랑음악
                </span>
            </div>
        </section>

    </main>

    <script>
        const emojis = ["🌎", "🩵", "🎵"];
        const emojiRain = document.getElementById("emojiRain");

        /* 터치 이모지 */
        function createTouchEmoji(x, y) {
            const emoji = document.createElement("span");

            emoji.className = "touch-emoji";
            emoji.textContent =
                emojis[Math.floor(Math.random() * emojis.length)];

            emoji.style.left = x + "px";
            emoji.style.top = y + "px";

            emoji.style.setProperty(
                "--move-x",
                Math.floor(Math.random() * 80 - 40) + "px"
            );

            emoji.style.setProperty(
                "--rotate",
                Math.floor(Math.random() * 120 - 60) + "deg"
            );

            document.body.appendChild(emoji);

            setTimeout(function () {
                emoji.remove();
            }, 850);
        }

        document.addEventListener("pointerdown", function (event) {
            createTouchEmoji(event.clientX, event.clientY);
        });

        let lastMoveTime = 0;

        document.addEventListener("pointermove", function (event) {
            const currentTime = Date.now();

            if (currentTime - lastMoveTime > 110) {
                createTouchEmoji(event.clientX, event.clientY);
                lastMoveTime = currentTime;
            }
        });

        /* 공연 정보가 열리면 이모지가 쏟아짐 */
        for (let i = 0; i < 40; i++) {
            const emoji = document.createElement("span");

            emoji.className = "rain-emoji";
            emoji.textContent =
                emojis[Math.floor(Math.random() * emojis.length)];

            emoji.style.left = Math.random() * 100 + "vw";

            emoji.style.fontSize =
                Math.floor(Math.random() * 23 + 22) + "px";

            emoji.style.setProperty(
                "--fall-time",
                (Math.random() * 0.8 + 1) + "s"
            );

            emoji.style.setProperty(
                "--fall-delay",
                (Math.random() * 0.5) + "s"
            );

            emoji.style.setProperty(
                "--fall-rotate",
                Math.floor(Math.random() * 720 - 360) + "deg"
            );

            emojiRain.appendChild(emoji);
        }

        setTimeout(function () {
            emojiRain.remove();
        }, 2600);
    </script>

</body>
</html>
