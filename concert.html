<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>공연 정보</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            padding: 40px 20px;
            font-family: Arial, sans-serif;
            background-color: #f4f8f2;
            color: #222;
        }

        .concert-info {
            max-width: 800px;
            margin: 0 auto;
            padding: 35px;
            background-color: white;
            border-radius: 16px;
            box-shadow: 0 5px 20px rgba(0, 0, 0, 0.1);
        }

        h1 {
            margin-top: 0;
            color: #2d7a2d;
        }

        h2 {
            margin-top: 35px;
        }

        .info-item {
            margin: 20px 0;
            padding-bottom: 15px;
            border-bottom: 1px solid #ddd;
            line-height: 1.6;
        }

        .back-button {
            display: inline-block;
            margin-top: 25px;
            padding: 12px 20px;
            color: white;
            text-decoration: none;
            background-color: #2d7a2d;
            border-radius: 8px;
        }

        .back-button:hover {
            background-color: #205d20;
        }
    </style>
</head>

<body>

    <main class="concert-info">
        <h1>🌏 지구사랑음악</h1>
        <h2>공연 안내</h2>

        <div class="info-item">
            <strong>📅 공연일</strong>
            <p>공연 날짜를 입력하세요.</p>
        </div>

        <div class="info-item">
            <strong>📍 장소</strong>
            <p>공연 장소를 입력하세요.</p>
        </div>

        <div class="info-item">
            <strong>⏰ 시간</strong>
            <p>공연 시간을 입력하세요.</p>
        </div>

        <div class="info-item">
            <strong>🎤 출연진</strong>
            <p>출연진 정보를 입력하세요.</p>
        </div>

        <div class="info-item">
            <strong>🎵 공연 소개</strong>
            <p>공연 소개를 입력하세요.</p>
        </div>

        <a class="back-button" href="index.html">포스터로 돌아가기</a>
    </main>

</body>
</html>
