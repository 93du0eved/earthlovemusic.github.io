<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>지구사랑음악</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            padding: 50px 20px;

            background-color: #dceffc;
            color: #162878;
            font-family: Arial, sans-serif;
        }

        /* 공연 정보 전체 카드 */
        .concert-info {
            width: 100%;
            max-width: 720px;
            margin: 0 auto;
            padding: 55px 45px;

            background-color: #fff;
            border: 3px solid #162878;
            box-shadow: 12px 12px 0 #162878;
        }

        /* 상단 제목 */
        .page-header {
            margin-bottom: 55px;
            text-align: center;
        }

        .sub-title {
            margin: 0 0 12px;

            color: #162878;
            font-size: 14px;
            font-weight: 800;
            letter-spacing: 5px;
        }

        h1 {
            margin: 0;

            color: #162878;
            font-size: clamp(36px, 8vw, 65px);
            font-weight: 900;
            letter-spacing: -4px;
            line-height: 1.1;
        }

        /* 정보 목록 */
        .info-list {
            border-top: 2px solid #162878;
        }

        .info-item {
            display: grid;
            grid-template-columns: 110px minmax(0, 1fr);
            gap: 25px;
            align-items: center;

            min-height: 100px;
            padding: 24px 5px;

            border-bottom: 2px solid #162878;
        }

        .label {
            color: #162878;
            font-size: 15px;
            font-weight: 900;
            letter-spacing: 2px;
        }

        .value {
            margin: 0;

            color: #111;
            font-size: clamp(17px, 4vw, 22px);
            font-weight: 600;
            line-height: 1.5;
            word-break: keep-all;
        }

        /* 출연진 영역 */
        .cast-item {
            align-items: start;
        }

        .cast-item .label {
            padding-top: 4px;
        }

        .cast-list {
            display: flex;
            flex-direction: column;
            gap: 26px;
        }

        .cast-team strong {
            display: inline-block;
            margin-bottom: 8px;

            color: #162878;
            font-size: 17px;
            font-weight: 900;
            letter-spacing: -0.5px;
        }

        .cast-team p {
            margin: 0;

            color: #111;
            font-size: 18px;
            font-weight: 600;
            line-height: 1.7;
            word-break: keep-all;
        }

        /* 휴대폰 화면 */
        @media (max-width: 600px) {
            body {
                padding: 25px 16px 40px;
            }

            .concert-info {
                padding: 42px 24px;
                border-width: 2px;
                box-shadow: 7px 7px 0 #162878;
            }

            .page-header {
                margin-bottom: 40px;
            }

            .sub-title {
                letter-spacing: 4px;
            }

            h1 {
                letter-spacing: -2.5px;
            }

            .info-item {
                grid-template-columns: 74px minmax(0, 1fr);
                gap: 13px;
                min-height: 90px;
                padding: 22px 0;
            }

            .label {
                font-size: 13px;
            }

            .cast-team strong {
                font-size: 16px;
            }

            .cast-team p {
                font-size: 16px;
            }
        }
    </style>
</head>

<body>

    <main class="concert-info">

        <header class="page-header">
            <p class="sub-title">LIVE BUSKING</p>
            <h1>지구사랑음악</h1>
        </header>

        <section class="info-list">

            <div class="info-item">
                <span class="label">DATE</span>
                <p class="value">2026.09.10</p>
            </div>

            <div class="info-item">
                <span class="label">PLACE</span>
                <p class="value">창의실습지원센터 앞 잔디마당</p>
            </div>

            <div class="info-item">
                <span class="label">TIME</span>
                <p class="value">15시</p>
            </div>

            <div class="info-item cast-item">
                <span class="label">CAST</span>

                <div class="cast-list">

                    <div class="cast-team">
                        <strong>TEAM 파랗게</strong>
                        <p>이건우 · 이영인 · 이창민 · 문수현</p>
                    </div>

                    <div class="cast-team">
                        <strong>TEAM 디마레인저</strong>
                        <p>송준성 · 이영인 · 엄가은</p>
                    </div>

                </div>
            </div>

        </section>

    </main>

</body>
</html>
    </main>

</body>
</html>
