<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>랜덤 공연 포스터</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            background-color: #000;
        }

        #posterLink {
            display: block;
            line-height: 0;
        }

        #poster {
            display: block;
            max-width: 100%;
            max-height: 100vh;
            object-fit: contain;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 포스터를 누르면 공연 정보 페이지로 이동 -->
    <a id="posterLink" href="concert.html">
        <img id="poster" alt="공연 포스터">
    </a>

    <script>
        const posters = [
            "poster1.png",
            "poster2.png",
            "poster3.png",
            "poster4.png",
            "poster5.png"
        ];

        const randomIndex = Math.floor(Math.random() * posters.length);
        const randomPoster = posters[randomIndex];

        document.getElementById("poster").src = randomPoster;
    </script>

</body>
</html>
