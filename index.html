<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>지구사랑음악</title>

<style>
body{
    margin:0;
    display:flex;
    justify-content:center;
    align-items:center;
    height:100vh;
    background:#111;
    font-family:sans-serif;
    color:white;
    flex-direction:column;
}

img{
    max-width:90%;
    max-height:75vh;
    border-radius:12px;
    box-shadow:0 0 20px rgba(0,0,0,.5);
}

button{
    margin-top:20px;
    padding:12px 20px;
    border:none;
    border-radius:8px;
    background:#2ecc71;
    color:white;
    font-size:16px;
    cursor:pointer;
}

button:hover{
    background:#27ae60;
}
</style>
</head>
<body>

<h1>지구사랑음악</h1>

<img id="poster" src="" alt="랜덤 포스터">

<button id="shuffle">다른 포스터 보기</button>

<script>
const posters = [
  "poster1.jpg",
  "poster2.jpg",
  "poster3.jpg",
  "poster4.jpg",
  "poster5.jpg"
];

const img = document.getElementById("poster");
const button = document.getElementById("shuffle");

function showRandomPoster(){
    const random = Math.floor(Math.random() * posters.length);
    img.src = posters[random];
}

// 페이지 열릴 때 랜덤 1장
showRandomPoster();

// 버튼 누르면 또 랜덤
button.addEventListener("click", showRandomPoster);
</script>

</body>
</html>
