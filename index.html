<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>지구사랑음악</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background-color: #fff;
            color: #000;
            font-family: Arial, sans-serif;
        }

        /* 처음 나타나는 인트로 */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #fff;
            color: #000;

            font-size: clamp(28px, 7vw, 70px);
            font-weight: 500;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;
        }

        #intro.hide {
            opacity: 0;
            visibility: hidden;
        }

        /* 전체 포스터 페이지 */
        #posterPage {
            width: 100%;
            min-height: 100vh;

            opacity: 0;
            transition: opacity 2.5s ease;
        }

        #posterPage.show {
            opacity: 1;
        }

        /* 제목 영역 */
        .poster-header {
            width: 100%;
            padding: 35px 20px 20px;

            background-color: #fff;
            text-align: center;
        }

        .poster-header h1 {
            margin: 0;

            color: #000;
            font-size: clamp(27px, 8vw, 48px);
            font-weight: 800;
            letter-spacing: -2px;
        }

        /* 클릭 안내 문구 */
        .click-message {
            margin: 12px 0 0;

            color: #222;
            font-size: clamp(15px, 4vw, 20px);
            font-weight: 500;
            letter-spacing: 0.5px;

            animation: messageBlink 1.4s ease-in-out infinite;
        }

        @keyframes messageBlink {
            0%, 100% {
                opacity: 0.45;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(3px);
            }
        }

        /* 포스터 영역 */
        .poster-area {
            width: 100%;
            padding: 0 16px 35px;
            background-color: #fff;
        }

        #posterLink {
            display: block;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            line-height: 0;
        }

        #poster {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;

            -webkit-tap-highlight-color: transparent;
        }

        /* 클릭했을 때 나타나는 이모지 */
        .click-emoji {
            position: fixed;
            z-index: 200;

            font-size: 30px;
            line-height: 1;

            pointer-events: none;
            user-select: none;

            animation: emojiPop 0.9s ease-out forwards;
        }

        @keyframes emojiPop {
            0% {
                opacity: 1;
                transform:
                    translate(-50%, -50%)
                    scale(0.4)
                    rotate(0deg);
            }

            60% {
                opacity: 1;
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        calc(-50% + var(--move-x)),
                        calc(-50% + var(--move-y))
                    )
                    scale(1.6)
                    rotate(var(--rotate));
            }
        }

        @media (min-width: 700px) {
            #poster {
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.14);
            }

            .poster-header {
                padding-top: 50px;
            }
        }
    </style>
</head>

<body>

    <!-- 처음 보이는 문구 -->
    <div id="intro">you found me!</div>

    <!-- 인트로가 끝난 후 나타나는 페이지 -->
    <main id="posterPage">

        <header class="poster-header">
            <h1>지구사랑음악</h1>
            <p class="click-message">Click this poster! ↓</p>
        </header>

        <section class="poster-area">
            <a id="posterLink" href="concert.html">
                <img id="poster" alt="지구사랑음악 공연 포스터">
            </a>
        </section>

    </main>

    <script>
        const posters = [
            "poster1.png",
            "poster2.png",
            "poster3.png",
            "poster4.png",
            "poster5.png"
        ];

        const emojis = ["🌎", "🎵", "🩵"];

        const randomIndex =
            Math.floor(Math.random() * posters.length);

        const intro =
            document.getElementById("intro");

        const posterPage =
            document.getElementById("posterPage");

        const posterLink =
            document.getElementById("posterLink");

        const poster =
            document.getElementById("poster");

        poster.src = posters[randomIndex];

        /* 포스터 로딩 후 인트로 사라짐 */
        poster.addEventListener("load", function () {
            setTimeout(function () {
                intro.classList.add("hide");
                posterPage.classList.add("show");
            }, 1500);
        });

        poster.addEventListener("error", function () {
            intro.classList.add("hide");
            posterPage.classList.add("show");
        });

        /* 포스터 클릭 효과 */
        posterLink.addEventListener("click", function (event) {
            event.preventDefault();

            const destination = posterLink.href;

            /* 클릭 위치 주변에 이모지 9개 생성 */
            for (let i = 0; i < 9; i++) {
                const emoji =
                    document.createElement("span");

                emoji.className = "click-emoji";

                emoji.textContent =
                    emojis[Math.floor(Math.random() * emojis.length)];

                emoji.style.left = event.clientX + "px";
                emoji.style.top = event.clientY + "px";

                const moveX =
                    Math.floor(Math.random() * 180 - 90) + "px";

                const moveY =
                    Math.floor(Math.random() * -150 - 30) + "px";

                const rotate =
                    Math.floor(Math.random() * 180 - 90) + "deg";

                emoji.style.setProperty("--move-x", moveX);
                emoji.style.setProperty("--move-y", moveY);
                emoji.style.setProperty("--rotate", rotate);

                document.body.appendChild(emoji);

                setTimeout(function () {
                    emoji.remove();
                }, 900);
            }

            /* 이모지 효과를 보여준 뒤 공연 정보로 이동 */
            setTimeout(function () {
                window.location.href = destination;
            }, 750);
        });
    </script>

</body>
</html>
