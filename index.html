<!DOCTYPE html>
<html lang="ko">
<head>
<meta charset="UTF-8">
<title>지구사랑음악</title>

<style>

body{
    margin:0;
    background:#f5f5f5;
    font-family:sans-serif;
}

h1{
    text-align:center;
    margin:40px;
}

.gallery{
    display:grid;
    grid-template-columns:repeat(auto-fit,minmax(250px,1fr));
    gap:20px;
    padding:30px;
}

.gallery img{
    width:100%;
    border-radius:10px;
    box-shadow:0 0 10px rgba(0,0,0,.2);
}

</style>

</head>

<body>

<h1>지구사랑음악</h1>

<div class="gallery">

<img src="poster1.jpg">
<img src="poster2.jpg">
<img src="poster3.jpg">
<img src="poster4.jpg">

</div>

</body>

</html>
