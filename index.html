<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>지구사랑음악</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html,
        body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            min-height: 100vh;
            overflow-x: hidden;
            background-color: #fff;
            color: #111;
            font-family: Arial, sans-serif;
        }

        /* 처음 나타나는 화면 */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 1000;

            display: flex;
            flex-direction: column;
            justify-content: center;
            align-items: center;

            background-color: #fff;
            color: #000;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;
        }

        #intro.hide {
            opacity: 0;
            visibility: hidden;
        }

        .intro-title {
            margin: 0;

            color: #000;
            font-size: clamp(28px, 7vw, 70px);
            font-weight: 500;
            text-align: center;
        }

        /* 인트로의 빨간색 CLICK */
        .intro-click {
            margin-top: 14px;

            color: #ff0000;
            font-size: clamp(15px, 4vw, 22px);
            font-weight: 700;
            letter-spacing: 3px;

            animation: clickBlink 1.1s ease-in-out infinite;
        }

        @keyframes clickBlink {
            0%,
            100% {
                opacity: 0.35;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(4px);
            }
        }

        /* 전체 포스터 페이지 */
        #posterPage {
            width: 100%;
            min-height: 100vh;

            opacity: 0;
            transition: opacity 2s ease;
        }

        #posterPage.show {
            opacity: 1;
        }

        /* 상단 제목 */
        .poster-header {
            padding: 40px 20px 24px;
            text-align: center;
        }

        .poster-header h1 {
            margin: 0;

            color: #111;
            font-size: clamp(34px, 9vw, 60px);
            font-weight: 900;
            letter-spacing: -3px;
        }

        /* 포스터 위 빨간색 CLICK 문구 */
        .click-message {
            margin: 13px 0 0;

            color: #ff0000;
            font-size: clamp(14px, 4vw, 18px);
            font-weight: 700;
            letter-spacing: 1px;

            animation: messageMove 1.3s ease-in-out infinite;
        }

        @keyframes messageMove {
            0%,
            100% {
                opacity: 0.4;
                transform: translateY(0);
            }

            50% {
                opacity: 1;
                transform: translateY(4px);
            }
        }

        /* 포스터 */
        .poster-area {
            width: 100%;
            padding: 0 16px 50px;
        }

        #posterLink {
            display: block;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            line-height: 0;
        }

        #poster {
            display: block;
            width: 100%;
            height: auto;

            cursor: pointer;
            -webkit-tap-highlight-color: transparent;
        }

        /* 터치 위치에 나타나는 이모지 */
        .touch-emoji {
            position: fixed;
            z-index: 1500;

            font-size: 27px;
            line-height: 1;

            pointer-events: none;
            user-select: none;

            animation: touchPop 0.85s ease-out forwards;
        }

        @keyframes touchPop {
            0% {
                opacity: 1;
                transform: translate(-50%, -50%) scale(0.4);
            }

            100% {
                opacity: 0;
                transform:
                    translate(
                        calc(-50% + var(--move-x)),
                        calc(-50% - 70px)
                    )
                    scale(1.3)
                    rotate(var(--rotate));
            }
        }

        /* 포스터 클릭 시 쏟아지는 이모지 */
        #emojiRain {
            position: fixed;
            inset: 0;
            z-index: 2000;

            display: none;
            overflow: hidden;
            pointer-events: none;

            background-color: rgba(255, 255, 255, 0.15);
        }

        #emojiRain.show {
            display: block;
        }

        .rain-emoji {
            position: absolute;
            top: -80px;

            line-height: 1;

            animation: emojiFall var(--fall-time) linear forwards;
            animation-delay: var(--fall-delay);
        }

        @keyframes emojiFall {
            from {
                opacity: 1;
                transform: translateY(-10vh) rotate(0deg);
            }

            to {
                opacity: 1;
                transform:
                    translateY(120vh)
                    rotate(var(--fall-rotate));
            }
        }

        @media (min-width: 700px) {
            #poster {
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.15);
            }

            .poster-header {
                padding-top: 55px;
            }
        }
    </style>
</head>

<body>

    <div id="intro">
        <p class="intro-title">you found me!</p>
        <span class="intro-click">CLICK</span>
    </div>

    <main id="posterPage">

        <header class="poster-header">
            <h1>지구사랑음악</h1>
            <p class="click-message">Click this poster! ↓</p>
        </header>

        <section class="poster-area">
            <a id="posterLink" href="concert.html">
                <img id="poster" alt="지구사랑음악 공연 포스터">
            </a>
        </section>

    </main>

    <div id="emojiRain"></div>

    <script>
        const posters = [
            "poster1.png",
            "poster2.png",
            "poster3.png",
            "poster4.png",
            "poster5.png"
        ];

        const emojis = ["🌎", "🩵", "🎵"];

        const intro = document.getElementById("intro");
        const posterPage = document.getElementById("posterPage");
        const posterLink = document.getElementById("posterLink");
        const poster = document.getElementById("poster");
        const emojiRain = document.getElementById("emojiRain");

        const randomIndex =
            Math.floor(Math.random() * posters.length);

        /* 포스터가 준비되면 인트로 종료 */
        function showPosterPage() {
            setTimeout(function () {
                intro.classList.add("hide");
                posterPage.classList.add("show");
            }, 1500);
        }

        poster.addEventListener("load", showPosterPage);

        poster.addEventListener("error", function () {
            intro.classList.add("hide");
            posterPage.classList.add("show");
        });

        poster.src = posters[randomIndex];

        /* 터치 이모지 만들기 */
        function createTouchEmoji(x, y) {
            const emoji = document.createElement("span");

            emoji.className = "touch-emoji";
            emoji.textContent =
                emojis[Math.floor(Math.random() * emojis.length)];

            emoji.style.left = x + "px";
            emoji.style.top = y + "px";

            emoji.style.setProperty(
                "--move-x",
                Math.floor(Math.random() * 80 - 40) + "px"
            );

            emoji.style.setProperty(
                "--rotate",
                Math.floor(Math.random() * 120 - 60) + "deg"
            );

            document.body.appendChild(emoji);

            setTimeout(function () {
                emoji.remove();
            }, 850);
        }

        /* 누른 위치에 이모지 표시 */
        document.addEventListener("pointerdown", function (event) {
            if (intro.classList.contains("hide")) {
                createTouchEmoji(event.clientX, event.clientY);
            }
        });

        /* 손가락이나 마우스를 움직일 때 이모지 표시 */
        let lastMoveTime = 0;

        document.addEventListener("pointermove", function (event) {
            const currentTime = Date.now();

            if (
                currentTime - lastMoveTime > 110 &&
                intro.classList.contains("hide")
            ) {
                createTouchEmoji(event.clientX, event.clientY);
                lastMoveTime = currentTime;
            }
        });

        /* 이모지 비 */
        function startEmojiRain() {
            emojiRain.innerHTML = "";
            emojiRain.classList.add("show");

            for (let i = 0; i < 50; i++) {
                const emoji = document.createElement("span");

                emoji.className = "rain-emoji";
                emoji.textContent =
                    emojis[Math.floor(Math.random() * emojis.length)];

                emoji.style.left = Math.random() * 100 + "vw";

                emoji.style.fontSize =
                    Math.floor(Math.random() * 25 + 23) + "px";

                emoji.style.setProperty(
                    "--fall-time",
                    (Math.random() * 0.7 + 0.8) + "s"
                );

                emoji.style.setProperty(
                    "--fall-delay",
                    (Math.random() * 0.4) + "s"
                );

                emoji.style.setProperty(
                    "--fall-rotate",
                    Math.floor(Math.random() * 720 - 360) + "deg"
                );

                emojiRain.appendChild(emoji);
            }
        }

        /* 포스터를 누르면 이모지가 쏟아진 뒤 이동 */
        posterLink.addEventListener("click", function (event) {
            event.preventDefault();

            startEmojiRain();

            setTimeout(function () {
                window.location.href = "concert.html";
            }, 1350);
        });
    </script>

</body>
</html>
