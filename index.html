<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>지구사랑음악</title>

    <style>
        * {
            box-sizing: border-box;
        }

        html, body {
            margin: 0;
            width: 100%;
            min-height: 100%;
        }

        body {
            background-color: #fff;
            color: #000;
            font-family: Arial, sans-serif;
        }

        /* 처음 나타나는 인트로 */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 100;

            display: flex;
            justify-content: center;
            align-items: center;

            background-color: #fff;
            color: #000;

            font-size: clamp(28px, 7vw, 70px);
            font-weight: 500;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;
        }

        #intro.hide {
            opacity: 0;
            visibility: hidden;
        }

        /* 제목과 포스터를 담는 전체 영역 */
        #posterPage {
            width: 100%;
            min-height: 100vh;

            opacity: 0;
            transition: opacity 2.5s ease;
        }

        #posterPage.show {
            opacity: 1;
        }

        /* 포스터 위 흰색 제목 영역 */
        .poster-header {
            width: 100%;
            padding: 35px 20px 28px;

            background-color: #fff;
            text-align: center;
        }

        .poster-header h1 {
            margin: 0;

            color: #000;
            font-size: clamp(27px, 8vw, 48px);
            font-weight: 800;
            letter-spacing: -2px;
        }

        /* 포스터 영역 */
        .poster-area {
            width: 100%;
            padding: 0 16px 35px;
            background-color: #fff;
        }

        #posterLink {
            display: block;
            width: 100%;
            max-width: 700px;
            margin: 0 auto;
            line-height: 0;
        }

        #poster {
            display: block;
            width: 100%;
            height: auto;
            cursor: pointer;
        }

        /* 컴퓨터 화면에서는 포스터 주변에 약간의 그림자 */
        @media (min-width: 700px) {
            #poster {
                box-shadow: 0 8px 30px rgba(0, 0, 0, 0.14);
            }

            .poster-header {
                padding-top: 50px;
            }
        }
    </style>
</head>

<body>

    <!-- 처음 보이는 문구 -->
    <div id="intro">you found me!</div>

    <!-- 인트로 뒤에 나타나는 페이지 -->
    <main id="posterPage">

        <header class="poster-header">
            <h1>지구사랑음악</h1>
        </header>

        <section class="poster-area">
            <!-- 포스터를 누르면 공연 정보로 이동 -->
            <a id="posterLink" href="concert.html">
                <img id="poster" alt="지구사랑음악 공연 포스터">
            </a>
        </section>

    </main>

    <script>
        const posters = [
            "poster1.png",
            "poster2.png",
            "poster3.png",
            "poster4.png",
            "poster5.png"
        ];

        const randomIndex = Math.floor(Math.random() * posters.length);
        const randomPoster = posters[randomIndex];

        const intro = document.getElementById("intro");
        const posterPage = document.getElementById("posterPage");
        const poster = document.getElementById("poster");

        poster.src = randomPoster;

        poster.addEventListener("load", function () {
            setTimeout(function () {
                intro.classList.add("hide");
                posterPage.classList.add("show");
            }, 1500);
        });

        /* 이미지 오류가 나도 인트로 화면에 멈추지 않도록 설정 */
        poster.addEventListener("error", function () {
            intro.classList.add("hide");
            posterPage.classList.add("show");
        });
    </script>

</body>
</html>
