<!DOCTYPE html>
<html lang="ko">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>랜덤 공연 포스터</title>

    <style>
        * {
            box-sizing: border-box;
        }

        body {
            margin: 0;
            min-height: 100vh;
            display: flex;
            justify-content: center;
            align-items: center;
            overflow: hidden;
            background-color: #000;
        }

        /* 처음 나타나는 인트로 화면 */
        #intro {
            position: fixed;
            inset: 0;
            z-index: 10;

            display: flex;
            justify-content: center;
            align-items: center;

            color: #000;
            background-color: #fff;

            font-family: Arial, sans-serif;
            font-size: clamp(28px, 7vw, 70px);
            font-weight: 500;
            letter-spacing: -1px;

            opacity: 1;
            visibility: visible;

            transition:
                opacity 1.5s ease,
                visibility 1.5s ease;
        }

        /* 인트로가 사라질 때 */
        #intro.hide {
            opacity: 0;
            visibility: hidden;
        }

        #posterLink {
            display: block;
            line-height: 0;
            opacity: 0;
            transform: scale(1.03);

            transition:
                opacity 2.5s ease,
                transform 2.5s ease;
        }

        /* 포스터가 나타날 때 */
        #posterLink.show {
            opacity: 1;
            transform: scale(1);
        }

        #poster {
            display: block;
            width: auto;
            max-width: 100vw;
            height: auto;
            max-height: 100vh;
            object-fit: contain;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <!-- 처음 보이는 문구 -->
    <div id="intro">you found me!</div>

    <!-- 포스터를 누르면 공연 정보 페이지로 이동 -->
    <a id="posterLink" href="concert.html">
        <img id="poster" alt="공연 포스터">
    </a>

    <script>
        const posters = [
            "poster1.png",
            "poster2.png",
            "poster3.png",
            "poster4.png",
            "poster5.png"
        ];

        const randomIndex = Math.floor(Math.random() * posters.length);
        const randomPoster = posters[randomIndex];

        const intro = document.getElementById("intro");
        const posterLink = document.getElementById("posterLink");
        const poster = document.getElementById("poster");

        poster.src = randomPoster;

        // 포스터 로딩이 완료된 후 인트로 효과 시작
        poster.addEventListener("load", function () {
            // 1.5초 동안 문구를 보여준 뒤 사라지게 함
            setTimeout(function () {
                intro.classList.add("hide");

                // 문구가 사라지는 동시에 포스터 등장
                posterLink.classList.add("show");
            }, 1500);
        });
    </script>

</body>
</html>
